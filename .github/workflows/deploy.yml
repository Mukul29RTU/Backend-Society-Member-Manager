name: Deploy Spring Boot to OCI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven # Change to 'gradle' if using Gradle

      # 3. Build JAR file
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests
        # For Gradle, use: ./gradlew bootJar -x test

      # 4. Copy JAR file to OCI Instance
      - name: Copy JAR to OCI
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "target/*.jar" # For Gradle: "build/libs/*.jar"
          target: "~/app/"
          strip_components: 1

      # 5. Restart application on OCI Instance
      - name: Restart App on OCI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            # Stop currently running jar process
            fuser -k 8080/tcp || true
            
            # Navigate to directory and start the app in background
            cd ~/app
            nohup java -jar *.jar > app.log 2>&1 &